function trendChart(arr,min,max,range,name){const pos=(p,i)=>[arr.length===1?310:45+i*530/(arr.length-1),195-(p.n-min)/range*155];let dots=arr.map(pos);let poly=dots.map(([x,y])=>x+','+y).join(' ');let lines=[0,1,2,3,4].map(i=>'<line x1="40" y1="'+(25+i*43)+'" x2="580" y2="'+(25+i*43)+'" stroke="#e9e0d6" stroke-dasharray="5 6"/>').join('');let circles=dots.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="7" fill="white" stroke="#bf7c8e" stroke-width="4"><title>'+arr[i].date+': '+arr[i].n+'</title></circle>').join('');let labels=arr.map(p=>'<div><strong>'+p.n+'</strong><small>'+p.date.slice(8,10)+'/'+p.date.slice(5,7)+'</small></div>').join('');return '<svg class="trend-svg" viewBox="0 0 600 240" role="img" aria-label="Evolución de '+esc(name)+'"><defs><linearGradient id="trendfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#efb3bd" stop-opacity=".45"/><stop offset="100%" stop-color="#efb3bd" stop-opacity=".03"/></linearGradient></defs>'+lines+'<polygon points="'+poly+' '+dots.at(-1)[0]+',205 '+dots[0][0]+',205" fill="url(#trendfill)"/><polyline points="'+poly+'" fill="none" stroke="#bf7c8e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'+circles+'</svg><div class="trend-labels">'+labels+'</div>'}
function metrics(){
 const existing=data().measures||{};
 const isFri=isToday()&&weekday(date)===4;
 let html=`<div class="hero"><h2>📏 Evolución de tu cuerpo</h2><p>Registra tus medidas cada viernes y visualiza tus avances durante el mes.</p><span class="pill">${isFri?'🌷 Hoy toca registrar':'📅 Registro recomendado: viernes'}</span></div>`;
 html+=`<div class="card"><h2>📐 Medidas · ${fmt(date)}</h2><div class="grid">`;
 MEASURES.forEach((m,i)=>{html+=`<label class="field"><span class="sub">${m}</span><input type="number" ${readOnly()} inputmode="decimal" step="0.1" min="0" value="${esc(existing[i]??'')}" placeholder="—" onchange="val('measures','${i}',this.value)"></label>`});
 html+='</div><p class="sub">Tus registros se guardan automáticamente por fecha.</p></div>';
 const points=allDates().filter(s=>Object.values(db[s].measures||{}).some(v=>v!==''));
 html+='<div class="card"><h2>📈 Tu evolución mensual</h2>';
 html+=`<label class="field">Selecciona una medida<select style="padding:12px;border-radius:12px;border:1px solid #e3d8ef" onchange="metricType=this.value;render()">${MEASURES.map(m=>`<option ${m===metricType?'selected':''}>${m}</option>`).join('')}</select></label>`;
 const idx=MEASURES.indexOf(metricType);
 const arr=points.filter(s=>s.slice(0,7)===date.slice(0,7)&&db[s].measures?.[idx]!=null&&db[s].measures[idx]!=='').map(s=>({date:s,n:Number(db[s].measures[idx])})).filter(p=>Number.isFinite(p.n));
 if(arr.length){
  const min=Math.min(...arr.map(p=>p.n)),max=Math.max(...arr.map(p=>p.n)),range=Math.max(max-min,1);
  html+=`<div class="trend-wrap">${trendChart(arr,min,max,range,metricType)}</div>`;
  const change=arr.length>1?arr[arr.length-1].n-arr[0].n:null;
  html+=`<div class="stat" style="margin-top:13px"><small>Cambio del mes</small><strong>${change===null?'—':(change>0?'+':'')+change.toFixed(1)}</strong><small>${metricType}</small></div>`;
 }else{html+='<p class="muted">Todavía no hay medidas de este mes para este indicador.</p>'}
 html+='</div>';
 const monthDays=allDates().filter(s=>s.slice(0,7)===date.slice(0,7)&&(Object.values(db[s].meals||{}).some(Boolean)||Object.values(db[s].exercise||{}).some(Boolean)||Object.values(db[s].weights||{}).some(v=>v!=='')));
 const calories=s=>FOOD.reduce((n,m,i)=>n+(db[s].meals?.[i]?m[2]||0:0),0);
 const monthlyKcal=monthDays.reduce((sum,s)=>sum+calories(s),0);
 html+=`<div class="card"><h2>📚 Historial diario</h2><p class="sub">Cada día empieza limpio, pero los datos anteriores siguen guardados.</p><div class="grid"><div class="stat"><small>Kcal registradas</small><strong>${monthlyKcal}</strong></div><div class="stat"><small>Días registrados</small><strong>${monthDays.length}</strong></div></div>`;
 html+=monthDays.length?monthDays.slice().reverse().map(s=>`<div class="exercise"><strong>${fmt(s)}</strong><p class="sub">🥗 ${Object.values(db[s].meals||{}).filter(Boolean).length} comidas · ${calories(s)} kcal · 🏋️ ${Object.values(db[s].exercise||{}).filter(Boolean).length} ejercicios · ${Object.values(db[s].weights||{}).filter(v=>v!=='').length} series con peso</p></div>`).join(''):'<p class="muted">Todavía no hay registros de este mes.</p>';
 html+='</div><div class="card"><h2>🗓️ Historial de medidas</h2>';
 html+=points.length?points.slice().reverse().map(s=>`<div class="row exercise"><span>${s}</span><button onclick="setDate('${s}')">Ver medidas</button></div>`).join(''):'<p class="muted">Aún no hay registros.</p>';
 return html+'</div>';
}
function calendar(){let d=fromDate(date),yr=d.getFullYear(),mo=d.getMonth()+monthOffset,first=new Date(yr,mo,1),y=first.getFullYear(),m=first.getMonth(),len=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let html=`<div class="card"><div class="row"><button onclick="monthOffset--;render()">‹</button><h2 style="text-transform:capitalize">${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><button onclick="monthOffset++;render()">›</button></div><div class="calendar">${['L','M','X','J','V','S','D'].map(v=>`<strong style="text-align:center">${v}</strong>`).join('')}${Array(offset).fill('<span></span>').join('')}`;for(let i=1;i<=len;i++){let s=localDate(new Date(y,m,i)),has=Object.values(db[s]||{}).some(v=>v&&typeof v==='object'&&Object.values(v).some(Boolean));html+=`<button class="${s===date?'current':''} ${has?'has':''}" onclick="monthOffset=0;setDate('${s}')">${i}</button>`}html+='</div><p class="sub">El borde verde indica que hay datos guardados. Toca un día para consultarlo.</p></div>';let kcal=monthDates().reduce((a,s)=>a+FOOD.reduce((sum,m,i)=>sum+(db[s].meals?.[i]?m[2]||0:0),0),0);html+=`<div class="grid"><div class="stat"><small>Kcal registradas en el mes seleccionado</small><strong>${kcal}</strong></div><div class="stat"><small>Días con comidas registradas</small><strong>${monthDates().filter(s=>Object.values(db[s].meals||{}).some(Boolean)).length}</strong></div></div><div class="card section"><h2>💾 Copia de seguridad</h2><p class="sub">Tus datos se guardan en este navegador. Exporta una copia periódicamente para no perder el historial.</p><div class="flex wrap"><button class="primary" onclick="exportData()">⬇ Exportar datos</button><button onclick="document.getElementById('importFile').click()">⬆ Importar copia</button><input type="file" accept="application/json,.json" id="importFile" hidden onchange="importData(this)"></div></div>`;return html}
function exportData(){let blob=new Blob([JSON.stringify({version:2,db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JEN-FIT-copia-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(input){let f=input.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.db||typeof x.db!=='object')throw Error();if(!confirm('¿Importar esta copia? Sustituirá los datos guardados en este dispositivo.'))return;db=x.db;persist();render();alert('Copia importada')}catch{alert('Archivo no válido')}}render();let lastToday=localDate(new Date());function refreshDaily(){const today=localDate(new Date());if(today!==lastToday){if(date===lastToday)date=today;lastToday=today;render()}else if(page==='entrenos'&&data().start?.[weekday(date)])render()}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDaily()});window.addEventListener('focus',refreshDaily);setInterval(refreshDaily,60000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
