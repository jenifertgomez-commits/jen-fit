<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#303348"><title>JEN FIT</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="JEN FIT"><style>body{margin:0;background:#f5f3f1;color:#303348;font:16px system-ui,-apple-system,sans-serif}header{background:#fff0d2;padding:25px 18px 18px}h1{margin:0;font-size:28px}small,.muted{color:#777b89}nav{display:flex;gap:8px;padding:12px;background:white;position:sticky;top:0;z-index:2}button{cursor:pointer;font:inherit;border:1px solid #ddd;border-radius:13px;padding:11px;background:white;color:#303348}nav button{flex:1;font-size:14px}.active,.primary{background:#303348;color:white}main{max-width:850px;margin:auto;padding:15px}.panel{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{padding:13px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}.item:last-child{border:0}.item input{width:22px;height:22px;accent-color:#12a87e}.item label{flex:1}.item strong{display:block}.item span{font-size:13px;color:#737789}.done{text-decoration:line-through;opacity:.6}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal button{padding:10px 0;border:0}.cal .chosen{background:#303348;color:white}.cal .today{outline:2px solid #e9bd66}.cal .blank{visibility:hidden}.total{font-size:34px;font-weight:750}#clock{font-size:36px;font-variant-numeric:tabular-nums;font-weight:700}.note{font-size:13px;color:#777}h2{font-size:21px;margin:8px 0 13px}</style><header><h1>JEN FIT ✨</h1><small>Tu plan de entrenamientos y alimentación</small></header><nav><button class="active" onclick="tab='entrenos';render()">Entrenamientos</button><button onclick="tab='comidas';render()">Alimentación</button><button onclick="tab='calendario';render()">Calendario</button></nav><main id="app"></main><script>
const workouts=[['DÍA 1 - GLÚTEO',[['Hip thrust libre','4 series | 6-8'],['Peso muerto rumano con barra','3 series | 8-10'],['Búlgara para glúteos','3 series | 8-10 por pierna'],['Abductor sentado en máquina','3 series | 12-15'],['Patada glúteo en polea','2 series | 12-15 por pierna'],['Plancha','3 series | 30 segundos']]],['DÍA 2 - TREN SUPERIOR',[['Press mancuerna sentado','4 series | 6-8'],['Jalón al pecho agarre cerrado','3 series | 8-10'],['Press pecho inclinado con mancuerna','3 series | 8-10'],['Remo a una mano con mancuerna','3 series | 10 por lado'],['Curl bíceps barra','3 series | 8-10'],['Extensión tríceps cuerda polea','3 series | 10-12'],['Flexiones','2 series']]],['DÍA 3 - GLÚTEO DE ARRIBA',[['Hip thrust máquina','3 series | 10-12'],['Step up en banco','3 series | 10 por pierna'],['Hiperextensiones','3 series | 12-15'],['Prensa horizontal','3 series | 10-12'],['Abducción lateral en polea por detrás','3 series | 15 por pierna'],['Brazo y pierna','3 series | 10 por lado'],['Elevación de piernas','3 series | 12']]],['DÍA 4 - FULL BODY',[['Hip thrust libre','3 series | 10'],['Dominadas','3 series | 6-8'],['Elevaciones laterales con mancuerna','3 series | 12-15'],['SUPER SERIE X3 RONDAS: Martillo mancuerna','10'],['SUPER SERIE X3 RONDAS: Fondos','10'],['Abductor sentado en máquina','3 series | 20'],['Plancha lateral','3 series | 20 segundos']]]];
const meals=[['Desayuno',[['Porridge cremoso de chocolate',514],['Bol de yogur con avena y fruta',474],['Huevos revueltos con tostadas',303],['Tostadas de pavo',424]]],['Media mañana y merienda',[['Tortitas de arroz',217],['Tortitas de avena con plátano y crema de...',181],['Bol de yogur con fruta',203],['Tostada de jamón serrano y tomate A',249],['Batido de fruta y cereales',226]]],['Comida',[['Arroz con pollo y verduras',540],['Guiso de lentejas',363],['Pasta con carne picada y verduras',425],['Garbanzos salteados con verduras y pech...',501],['Ensalada de pollo y...',634],['Salteado de ternera',null],['Salmón con verduras a la plancha',484],['Wrap frío de verduras',434],['Arroz con atún y guisantes',471],['Alubias con lomo de cerdo',494]]],['Cena',[['Tortilla de espinacas y queso light',349],['Patata asada con salmón A',361],['Wrap integral de pollo con aguacate y...',null],['Merluza con patata y verduras',413],['Hamburguesa de pollo con queso',300],['Arroz de gambas con espárrago',null],['Huevos rotos fit',437],['Arroz con pollo y verduras A',640],['Salmorejo con huevo y jamón serrano A',318],['Tostadas de caballa, tomate y aguacate',328]]]];
let tab='entrenos',day=0,date=new Date().toLocaleDateString('sv-SE'),month=new Date(date+'T12:00'),started=null,timer=null;const read=()=>JSON.parse(localStorage.getItem('jenfit')||'{}');const save=(k,v)=>{let s=read();s[k]=v;localStorage.setItem('jenfit',JSON.stringify(s))};const key=(type,id)=>date+'|'+type+'|'+id;function toggle(type,id,checked){save(key(type,id),checked);render()}function start(){if(started){let seconds=Math.floor((Date.now()-started)/1000);save(key('duration',day),seconds);started=null;clearInterval(timer)}else{started=Date.now();timer=setInterval(()=>{let e=document.getElementById('clock');if(e)e.textContent=fmt(Math.floor((Date.now()-started)/1000))},1000)}render()}function fmt(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}function items(arr,type,prefix){return arr.map(([name,detail],i)=>{let id=prefix+'-'+i,checked=!!read()[key(type,id)];return `<div class="item"><input type="checkbox" id="${type+id}" ${checked?'checked':''} onchange="toggle('${type}','${id}',this.checked)"><label for="${type+id}" class="${checked?'done':''}"><strong>${name}</strong><span>${type==='meal'?(detail===null?'Calorías no visibles en la fotografía':detail+' kcal'):detail}</span></label></div>`}).join('')}function changeDay(i){day=i;render()}function changeDate(d){date=d;render()}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function calendar(){let first=new Date(month.getFullYear(),month.getMonth(),1),start=(first.getDay()+6)%7,count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),html=`<div class="panel"><div class="row"><button onclick="moveMonth(-1)">‹</button><h2>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><button onclick="moveMonth(1)">›</button></div><div class="cal">`;for(let d of ['L','M','X','J','V','S','D'])html+=`<b>${d}</b>`;for(let i=0;i<start;i++)html+='<span></span>';for(let i=1;i<=count;i++){let d=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,has=Object.keys(read()).some(k=>k.startsWith(d+'|')&&read()[k]===true);html+=`<button class="${d===date?'chosen':''} ${d===new Date().toLocaleDateString('sv-SE')?'today':''}" onclick="changeDate('${d}')">${i}${has?' •':''}</button>`}return html+'</div><p class="note">• Indica días con actividades marcadas. Semana de lunes a domingo.</p></div>'}function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===['entrenos','comidas','calendario'].indexOf(tab)));let html=`<div class="panel"><div class="row"><div><small>Fecha seleccionada</small><br><b>${new Date(date+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b></div><input type="date" value="${date}" onchange="changeDate(this.value)" style="max-width:135px"></div></div>`;if(tab==='calendario'){html+=calendar();html+='<p class="note">Selecciona una fecha y entra en Entrenamientos o Alimentación para revisar ese día.</p>'}if(tab==='entrenos'){html+=`<div class="tabs">${workouts.map((w,i)=>`<button class="${day===i?'active':''}" onclick="changeDay(${i})">${w[0]}</button>`).join('')}</div><div class="panel"><h2>${workouts[day][0]}</h2><div id="clock">${started?fmt(Math.floor((Date.now()-started)/1000)):fmt(read()[key('duration',day)]||0)}</div><p><button class="primary" onclick="start()">${started?'FINALIZAR ENTRENAMIENTO':'INICIO ENTRENAMIENTO'}</button></p><small>${workouts[day][1].filter((_,i)=>read()[key('exercise',day+'-'+i)]).length} de ${workouts[day][1].length} ejercicios completados</small>${items(workouts[day][1],'exercise',day)}</div>`}if(tab==='comidas'){let total=0,count=0;meals.forEach((m,g)=>m[1].forEach((r,i)=>{if(read()[key('meal',g+'-'+i)]){count++;total+=r[1]||0}}));html+=`<div class="panel"><small>Calorías de recetas completadas</small><div class="total">${total} kcal</div><span class="muted">${count} recetas marcadas hoy</span><p class="note">Las calorías de complementos y recetas sin cifra visible no se suman.</p></div>`;meals.forEach((m,g)=>{html+=`<div class="panel"><h2>${m[0]}</h2>${items(m[1],'meal',g)}</div>`});html+='<div class="panel"><b>Indicaciones originales</b><p>Desayuno: intenta que al menos 3–4 días por semana lleve kiwi o chía.</p><p>Media mañana y merienda: elige 2 distintas al día.</p><p>Comida: de postre, 1 fruta (150 g) o 1 yogur de proteínas. Añadir 30 g de pan integral en todas las comidas.</p><p>Cena: de postre, 10 g de chocolate negro 85 % o 1 yogur de proteínas.</p></div>'}document.getElementById('app').innerHTML=html}render();if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
